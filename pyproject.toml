[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--alluredir=target/allure-results"
]
markers = [
    "courier: тесты для работы с курьерами",
    "order: тесты для работы с заказами",
]
